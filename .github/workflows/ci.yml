name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Pinned to v1: .golangci.yaml at the repo root is in the v1 schema, and
      # golangci-lint v2 rejects it. Bumping to v2 means migrating that file
      # (`golangci-lint migrate`), which is a separate change.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install
        run: cd ui && npm ci

      - name: Lint
        run: cd ui && npm run lint

      - name: Build
        run: cd ui && npm run build
